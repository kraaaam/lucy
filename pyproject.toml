[project]
name = "lucy"
version = "0.1.0"
description = "Multi-tenant API gateway for messaging platforms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.14,<4.0",
    "psycopg[binary]>=3.1,<4.0",
    "django-redis>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "celery[redis]>=5.3,<6.0",
    "django-celery-beat>=2.5,<3.0",
    "djangorestframework-simplejwt>=5.3,<6.0",
    "django-oauth-toolkit>=2.3,<3.0",
    "httpx>=0.25,<1.0",
    "django-environ>=0.11,<1.0",
    "gunicorn>=21.2,<22.0",
    "structlog>=23.2,<24.0",
    "django-structlog>=8.0,<9.0",
    "drf-spectacular>=0.27,<1.0",
    "django-cors-headers>=4.3,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8.0",
    "pytest-django>=4.7,<5.0",
    "pytest-cov>=4.1,<5.0",
    "factory-boy>=3.3,<4.0",
    "black>=23.0,<25.0",
    "isort>=5.12,<6.0",
    "ruff>=0.1,<1.0",
    "mypy>=1.7,<2.0",
    "django-stubs>=4.2,<5.0",
    "djangorestframework-stubs>=3.14,<4.0",
    "pre-commit>=3.5,<4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]
known_first_party = ["config", "apps"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise without from inside except
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/settings/*.py" = ["F405"]
"**/tasks.py" = ["ARG001"]  # Celery tasks often have unused args during development
"**/views.py" = ["ARG001", "ARG002"]  # Views need request param for signature

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--reuse-db",
    "--cov=apps",
    "--cov-report=html",
    "--cov-report=term-missing",
]
testpaths = ["apps"]
